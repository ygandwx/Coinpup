name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: services/api/src
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Lint, unit tests and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Run fast checks
        run: python scripts/check.py fast

  ocr:
    name: Optional OCR dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-ocr.lock
      - name: Install default and optional locked dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --require-hashes -r requirements-ocr.lock
      - name: Check real optional libraries
        run: python scripts/check.py ocr

  corpus:
    name: Fictional OCR corpus toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-benchmark.lock
      - name: Install locked corpus builder
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --require-hashes -r requirements-benchmark.lock
      - name: Fetch and verify fixed public fonts
        run: python scripts/ocr_benchmark/fonts.py fetch --source-dir build/corpus-sources
      - name: Check real CJK fonts and PDF toolchain
        env:
          COINPUP_CORPUS_SOURCES: build/corpus-sources
        run: python scripts/check.py corpus
      - name: Generate the frozen fictional corpus offline
        run: |
          python -m scripts.ocr_benchmark.corpus generate --source-dir build/corpus-sources --output-dir build/fictional-corpus
          python -m scripts.ocr_benchmark.corpus verify --output-dir build/fictional-corpus
          python -c 'import json,pathlib; print("CORPUS_MANIFEST_V1=" + json.dumps(json.loads(pathlib.Path("build/fictional-corpus/manifest.json").read_text()), ensure_ascii=False, separators=(",",":")))'
      - name: Require exact frozen Linux input bytes
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          frozen = json.loads(pathlib.Path("tests/fixtures/ocr/corpus-frozen.json").read_text())
          data = pathlib.Path("build/fictional-corpus/manifest.json").read_bytes()
          assert hashlib.sha256(data).hexdigest() == frozen["manifest_sha256"], "Frozen corpus drift"
          assert json.loads(data)["assets"] == frozen["assets"], "Frozen input assets drift"
          print("All 62 frozen Linux assets and the complete manifest match exactly")
          PY
      - name: Preserve fictional inputs and their actual hashes
        uses: actions/upload-artifact@v4
        with:
          name: fictional-ocr-corpus
          path: build/fictional-corpus
          if-no-files-found: error

  engine_assets:
    name: Fixed offline OCR engine inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install default test tools only
        run: python -m pip install -r requirements-dev.lock
      - name: Cache fixed inputs, always verify restored bytes
        uses: actions/cache@v4
        with:
          path: build/engine-assets
          key: ocr-fixed-inputs-v1-${{ hashFiles('tests/fixtures/ocr/engine-assets.json') }}
      - name: Fetch fixed candidate artifacts and original notices
        run: python -m scripts.ocr_benchmark.engine_assets fetch --output-dir build/engine-assets
      - name: Verify offline files and inspect real wheel contents
        env:
          COINPUP_ENGINE_ASSETS: build/engine-assets
        run: python scripts/check.py assets
      - name: Require offline CLI verification
        run: python -m scripts.ocr_benchmark.engine_assets verify --output-dir build/engine-assets

  engine_environments:
    name: Isolated Linux OCR candidates
    needs: corpus
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            ops/ocr-benchmark/paddle.lock
            ops/ocr-benchmark/bootstrap.lock
      - name: Install host test tools only
        run: python -m pip install -r requirements-dev.lock
      - name: Reuse fixed inputs, always verify restored bytes
        uses: actions/cache@v4
        with:
          path: build/engine-assets
          key: ocr-fixed-inputs-v1-${{ hashFiles('tests/fixtures/ocr/engine-assets.json') }}
      - name: Acquire fixed sources and complete hashed wheelhouse
        run: |
          python -m scripts.ocr_benchmark.engine_assets fetch --output-dir build/engine-assets
          # Public pinned artifacts must be readable by the isolated non-root candidate.
          chmod -R go+rX build/engine-assets
          python ops/ocr-benchmark/build_inputs.py fetch --output-dir build/engine-build-inputs
          python ops/ocr-benchmark/build_inputs.py verify --output-dir build/engine-build-inputs
          python - <<'PY'
          import pathlib, shutil
          target = pathlib.Path("build/paddle-wheelhouse")
          target.mkdir(parents=True, exist_ok=True)
          for wheel in pathlib.Path("build/engine-assets/wheels").glob("*.whl"):
              shutil.copyfile(wheel, target / wheel.name)
          PY
          python -m pip download --require-hashes --only-binary=:all: --find-links build/paddle-wheelhouse -r ops/ocr-benchmark/paddle.lock -r ops/ocr-benchmark/bootstrap.lock --dest build/paddle-wheelhouse
      - name: Build both candidates with offline installation and compilation
        run: |
          docker build --progress=plain --target tesseract -f ops/ocr-benchmark/Dockerfile -t coinpup-ocr-tesseract:ci .
          docker build --progress=plain --target paddle -f ops/ocr-benchmark/Dockerfile -t coinpup-ocr-paddle:ci .
      - name: Reject missing local models before engine initialization
        run: |
          mkdir -p build/empty-assets build/candidate-reports/missing-models-paddle build/candidate-reports/missing-models-tesseract
          sudo chown 10001:10001 build/candidate-reports/missing-models-paddle build/candidate-reports/missing-models-tesseract
          COINPUP_TASK_CPUS=$(python -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')
          for engine in tesseract paddle; do
            if timeout --signal=TERM --kill-after=10s 600s docker run --rm --init --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --cpuset-cpus "$COINPUP_TASK_CPUS" --cpus 2 --memory 4g --memory-swap 4g --pids-limit 128 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777 -e HOME=/tmp/ocr-home \
              --mount type=bind,src="$PWD/build/empty-assets",dst=/opt/assets,readonly \
              --mount type=bind,src="$PWD/build/candidate-reports/missing-models-$engine",dst=/audit \
              "coinpup-ocr-$engine:ci" 2>"build/missing-models-$engine.stderr"; then
              echo "Missing models unexpectedly initialized $engine"
              exit 1
            fi
            python - "$engine" <<'PY'
          import json, pathlib, sys
          engine = sys.argv[1]
          assert "candidate_models_invalid" in pathlib.Path(f"build/missing-models-{engine}.stderr").read_text().splitlines()
          report = json.loads(pathlib.Path(f"build/candidate-reports/missing-models-{engine}/report.json").read_text())
          assert report["status"] == "failed" and report["reason"] == "candidate_models_invalid"
          assert report["initialization_attempted"] is False and report["initialization"] is None
          assert report["inference_performed"] is False
          print(f"{engine}: missing models rejected before initialization")
          PY
          done
      - name: Audit and initialize both candidates without network or recognition
        run: |
          mkdir -p build/candidate-reports/paddle build/candidate-reports/tesseract build/empty-assets
          sudo chown 10001:10001 build/candidate-reports/paddle build/candidate-reports/tesseract
          COINPUP_TASK_CPUS=$(python -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')
          COINPUP_TASK_FAILURE=0
          for engine in tesseract paddle; do
            if timeout --signal=TERM --kill-after=10s 600s docker run --rm --init --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --cpuset-cpus "$COINPUP_TASK_CPUS" --cpus 2 --memory 4g --memory-swap 4g --pids-limit 128 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777 -e HOME=/tmp/ocr-home \
              --mount type=bind,src="$PWD/build/engine-assets",dst=/opt/assets,readonly \
              --mount type=bind,src="$PWD/build/candidate-reports/$engine",dst=/audit \
              "coinpup-ocr-$engine:ci"; then
              echo "$engine initialization and audit succeeded"
            else
              COINPUP_TASK_FAILURE=1
            fi
          done
          exit "$COINPUP_TASK_FAILURE"
      - name: Verify real initialization, sources and native reports
        env:
          COINPUP_ENGINE_ASSETS: build/engine-assets
          COINPUP_CANDIDATE_REPORTS: build/candidate-reports
        run: python scripts/check.py candidates
      - name: Obtain the exactly frozen fictional development carriers
        uses: actions/download-artifact@v4
        with:
          name: fictional-ocr-corpus
          path: build/fictional-corpus
      - name: Run real repeated recognition on independent development inputs only
        run: >-
          python -m scripts.ocr_benchmark.development_run
          --corpus-dir build/fictional-corpus
          --assets-dir build/engine-assets
          --output-dir build/development-reports
      - name: Preserve every actual development response and the configuration choice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-development-evidence
          path: build/development-reports/**/*.json
          if-no-files-found: warn
      - name: Print actual public provenance for review
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          for engine in ("tesseract", "paddle"):
              directory = pathlib.Path("build/candidate-reports") / engine
              report = directory / "report.json"
              if report.is_file():
                  full = json.loads(report.read_text())
                  review = {key: full.get(key) for key in ("version", "engine", "status", "reason", "initialization_attempted", "initialization", "inference_performed", "runtime", "thread_environment", "pip_check", "license_unresolved", "distribution_unresolved", "native_policy_identities", "native_build")}
                  review["native"] = [{key: item.get(key) for key in ("path", "sha256", "byte_size", "missing", "dependencies", "reviewed_license_policy")} for item in full.get("native", [])]
                  print("CANDIDATE_REVIEW_V1=" + json.dumps(review, ensure_ascii=False, separators=(",", ":")))
                  print("Full original notices and installed inventories are retained in the uploaded report.json artifact")
              log = directory / "initialization.log"
              if log.is_file():
                  print("CANDIDATE_INIT_LOG " + engine)
                  print(log.read_text(errors="replace")[-8192:])
          PY
      - name: Preserve actual candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-ocr-candidate-evidence
          path: build/candidate-reports
          if-no-files-found: warn

  web:
    name: Web type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - run: git -C ../.. diff --exit-code apps/web/src/generated
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  database:
    name: PostgreSQL migrations and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: coinpup
          POSTGRES_USER: coinpup
          # Fictional credentials for this disposable CI database only.
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coinpup -d coinpup"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COINPUP_DATABASE_URL: postgresql+psycopg://coinpup:test-only@localhost:5432/coinpup
      COINPUP_RUN_DB_TESTS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Run disposable database checks
        run: python scripts/check.py db

  container:
    name: Container, real browser login and backup restoration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Fictional credentials for the disposable CI database, never deployment defaults.
      E2E_USERNAME: admin-e2e
      E2E_PASSWORD: Test-only-password-2026!
      BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install browser tests
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Create disposable development configuration
        run: python3 scripts/init_env.py
      - name: Start services
        run: docker compose up -d --build --wait
      - name: Apply migrations
        run: docker compose exec -T api python -m alembic upgrade head
      - name: Verify API connection
        run: curl --fail http://127.0.0.1:8000/api/v1/health/ready
      - name: Create disposable test administrator
        run: >-
          docker compose exec -T
          -e COINPUP_ENVIRONMENT=test -e COINPUP_CREATE_TEST_ADMIN=1
          -e E2E_USERNAME -e E2E_PASSWORD
          api python scripts/create_test_admin.py
      - name: Verify real browser authentication
        run: npm --prefix apps/web run test:e2e
      - name: Verify database and private-file bundles in isolated recovery targets
        run: >-
          docker compose exec -T
          -e COINPUP_ENVIRONMENT=test -e COINPUP_RUN_BACKUP_TESTS=1
          api python scripts/check_compose_backup.py
      - name: Save browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
      - name: Remove disposable services and database
        if: always()
        run: docker compose down --volumes
