name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full tier: every stress/bound case and the complete browser suite.
    - cron: "23 18 * * *"

permissions:
  contents: read

concurrency:
  # Supersede outdated PR checks. Every full run has its own group so queued
  # main, nightly and manual runs cannot replace one another either.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONPATH: services/api/src
  PYTHONUTF8: "1"

jobs:
  scope:
    # PRs use the fast tier; main, nightly and manual runs use the full tier.
    # Docs-only PRs skip database and container work; the required checks still report.
    name: Select CI tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.select.outputs.heavy }}
      tier: ${{ steps.select.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "tier=full" >> "$GITHUB_OUTPUT"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tier=pr" >> "$GITHUB_OUTPUT"
          # Count the source path when a file moves into documentation.
          changed=$(git diff --no-renames --name-only "$BASE...$HEAD")
          printf '%s\n' "$changed"
          code=$(printf '%s\n' "$changed" | grep -Ev '^(docs/.*|.*\.md|LICENSE)$' | grep -c . || true)
          if [ "$code" = 0 ]; then echo "heavy=false" >> "$GITHUB_OUTPUT"; else echo "heavy=true" >> "$GITHUB_OUTPUT"; fi

  quality:
    name: Lint, unit tests and documentation
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Run fast checks
        run: python scripts/check.py fast
      - name: Install locked Invoice render and validation dependencies
        run: python -m pip install --require-hashes -r requirements-invoice.lock -r requirements-benchmark.lock
      - name: Prepare complete pinned Invoice fonts
        run: |
          python -m scripts.ocr_benchmark.fonts fetch --source-dir "$RUNNER_TEMP/invoice-font-sources"
          python scripts/build_invoice_fonts.py "$RUNNER_TEMP/invoice-font-sources" "$RUNNER_TEMP/invoice-fonts"
      - name: Check real Invoice text rendering
        env:
          COINPUP_INVOICE_FONT_DIR: ${{ runner.temp }}/invoice-fonts
        run: python scripts/check.py invoice

      - name: Verify durable Invoice originals and isolated bundle replay
        if: needs.scope.outputs.heavy == 'true'
        env:
          COINPUP_ENVIRONMENT: test
          COINPUP_DATABASE_URL: postgresql+psycopg://coinpup:test-only@127.0.0.1:5432/coinpup
          COINPUP_RUN_DB_TESTS: "1"
          COINPUP_RUN_BACKUP_TESTS: "1"
          COINPUP_INVOICE_FONT_DIR: ${{ runner.temp }}/invoice-fonts
          PYTHONPATH: services/api/src:scripts:.
        run: |
          python -m scripts.start_database_ci
          # Use the exact PG17 client paired with the disposable server, even if
          # the Ubuntu host ships an older pg_dump. Only archive streams cross stdin/stdout.
          client="$RUNNER_TEMP/invoice-pg-client"
          mkdir -m 700 "$client"
          cat > "$client/pg_dump" <<'SH'
          #!/bin/sh
          set -eu
          exec docker exec -i -e PGDATABASE -e PGUSER -e PGOPTIONS \
            -e PGHOST=/var/run/postgresql -e PGPORT=5432 coinpup-ci-postgres pg_dump "$@"
          SH
          sed 's/coinpup-ci-postgres pg_dump/coinpup-ci-postgres pg_restore/' \
            "$client/pg_dump" > "$client/pg_restore"
          chmod 700 "$client/pg_dump" "$client/pg_restore"
          "$client/pg_dump" --version
          "$client/pg_restore" --version
          PATH="$client:$PATH" python scripts/check.py invoice-db
      - name: Remove disposable Invoice database
        if: ${{ always() && needs.scope.outputs.heavy == 'true' }}
        run: python -m scripts.start_database_ci --stop

  web:
    name: Web type check and build
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - run: git -C ../.. diff --exit-code apps/web/src/generated
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: Check Flutter workspace
        if: ${{ needs.scope.outputs.heavy == 'true' && hashFiles('apps/mobile/pubspec.yaml') != '' }}
        working-directory: apps/mobile
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"
        run: |
          sdk="$RUNNER_TEMP/coinpup-flutter"
          git clone --quiet --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$sdk"
          test "$(git -C "$sdk" rev-parse HEAD)" = ab2912035e160d9cad6306df307576da6128ebdb
          "$sdk/bin/flutter" --version
          "$sdk/bin/flutter" pub get --enforce-lockfile
          "$sdk/bin/dart" format --output=none --set-exit-if-changed lib test
          "$sdk/bin/flutter" analyze --fatal-infos
          "$sdk/bin/flutter" test

  database-parts:
    name: PostgreSQL integration partition ${{ matrix.part }}
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    timeout-minutes: 40
    env:
      COINPUP_DATABASE_URL: postgresql+psycopg://coinpup:test-only@localhost:5432/coinpup
      COINPUP_RUN_DB_TESTS: "1"
      COINPUP_DB_CI_TIER: ${{ needs.scope.outputs.tier }}
      # A slow test prints its threads without interrupting setup, calls or teardown.
      PYTEST_ADDOPTS: "-vv --durations=20 -p scripts.db_ci_pytest"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements-invoice.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Install the locked Invoice Logo decoder
        run: python -m pip install --require-hashes -r requirements-invoice.lock
      - name: Run disposable database checks
        id: database_checks
        # The pre-checkout service hook cannot use the existing official-image fallback.
        # Each partition has its own database and exercises the complete migration round trip.
        env:
          COINPUP_DB_CI_PART: ${{ matrix.part }}
          COINPUP_DB_CI_REPORT: ${{ runner.temp }}/part-${{ matrix.part }}.json
        run: |
          python -m scripts.start_database_ci
          /usr/bin/time -v python scripts/check.py db 2> >(tee "$RUNNER_TEMP/db-stderr.log" >&2)
      - name: Capture failed partition diagnostics
        if: ${{ always() && steps.database_checks.outcome != 'success' }}
        run: |
          group=$(awk -F: '$1 == "0" {print $3}' /proc/self/cgroup)
          for metric in memory.events memory.max memory.peak; do
            file="/sys/fs/cgroup${group%/}/$metric"
            if test -r "$file"; then echo "$metric"; cat "$file"; fi
          done
          df -h "$RUNNER_TEMP"
          if docker container inspect coinpup-ci-postgres >/dev/null 2>&1; then
            docker inspect --format 'PostgreSQL status={{.State.Status}} OOMKilled={{.State.OOMKilled}} exit={{.State.ExitCode}}' coinpup-ci-postgres
            docker exec coinpup-ci-postgres pg_isready -U coinpup -d coinpup
            docker exec coinpup-ci-postgres psql -X -U coinpup -d coinpup -c \
              "SELECT deadlocks, temp_files, temp_bytes, sessions_fatal, sessions_killed FROM pg_stat_database WHERE datname = current_database()"
          fi
      - name: Save failed partition stderr
        if: ${{ always() && steps.database_checks.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: db-stderr-part-${{ matrix.part }}
          path: ${{ runner.temp }}/db-stderr.log
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore
      - name: Remove disposable database
        if: always()
        run: python -m scripts.start_database_ci --stop
      - name: Save partition test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-ci-part-${{ matrix.part }}
          path: ${{ runner.temp }}/part-${{ matrix.part }}.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  database:
    name: PostgreSQL migrations and integration tests
    needs: [scope, database-parts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Docs-only change needs no database run
        if: needs.scope.outputs.heavy == 'false'
        run: echo "Docs-only pull request; documentation checks run in the quality job."
      - name: Require all database partitions to succeed
        if: needs.scope.outputs.heavy != 'false'
        env:
          PARTS_RESULT: ${{ needs.database-parts.result }}
        run: test "$PARTS_RESULT" = success
      - name: Check out source
        if: needs.scope.outputs.heavy != 'false'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: needs.scope.outputs.heavy != 'false'
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.heavy != 'false'
        with:
          pattern: db-ci-part-*
          path: ${{ runner.temp }}/db-ci
          merge-multiple: true
      - name: Verify complete integration test execution
        if: needs.scope.outputs.heavy != 'false'
        run: >-
          python -m scripts.db_ci_manifest verify
          $(for i in 0 1 2 3 4 5 6 7; do printf '%s ' "$RUNNER_TEMP/db-ci/part-$i.json"; done)

  container:
    name: Container, real browser login and backup restoration
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    # The full browser suite, recovery, artifacts and cleanup need a separate job budget.
    timeout-minutes: ${{ needs.scope.outputs.tier == 'full' && 35 || 25 }}
    env:
      # Fictional credentials for the disposable CI database, never deployment defaults.
      E2E_USERNAME: admin-e2e
      E2E_PASSWORD: Test-only-password-2026!
      BASE_URL: http://127.0.0.1:8000
      COMPOSE_FILE: ${{ github.workspace }}/compose.yaml:${{ github.workspace }}/ops/compose.browser.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install browser tests
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Create disposable development configuration
        run: python3 scripts/init_env.py
      - name: Start services
        run: |
          python3 scripts/prepare_browser_ci_image.py --pull
          export COMPOSE_FILE="${COMPOSE_FILE}:${GITHUB_WORKSPACE}/build/compose.browser-images.yaml"
          echo "COMPOSE_FILE=${COMPOSE_FILE}" >> "$GITHUB_ENV"
          docker compose up -d --build --wait
      - name: Apply migrations
        run: docker compose exec -T api python -m alembic upgrade head
      - name: Verify API connection
        run: curl --fail http://127.0.0.1:8000/api/v1/health/ready
      - name: Create disposable test administrator
        run: >-
          docker compose exec -T
          -e COINPUP_ENVIRONMENT=test -e COINPUP_CREATE_TEST_ADMIN=1
          -e E2E_USERNAME -e E2E_PASSWORD
          api python scripts/create_test_admin.py
      - name: Verify recurring maintenance CLI
        run: docker compose exec -T api python -m coinpup_api.jobs recurring-invoices --per-rule 1
      - name: Verify real browser authentication
        # PR tier runs the smoke specs; main, nightly and manual runs use the full suite.
        env:
          TIER: ${{ needs.scope.outputs.tier }}
        run: |
          if [ "$TIER" = pr ]; then
            npm --prefix apps/web run test:e2e:smoke
          else
            npm --prefix apps/web run test:e2e
          fi
      - name: Verify database and private-file bundles in isolated recovery targets
        run: >-
          docker compose exec -T
          -e COINPUP_ENVIRONMENT=test -e COINPUP_RUN_BACKUP_TESTS=1
          api python scripts/check_compose_backup.py
      - name: Save browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
      - name: Remove disposable services and database
        if: always()
        run: docker compose down --volumes
