name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: services/api/src
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Lint, unit tests and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Run fast checks
        run: python scripts/check.py fast

  web:
    name: Web type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - run: git -C ../.. diff --exit-code apps/web/src/generated
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  database-parts:
    name: PostgreSQL integration partition ${{ matrix.part }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1]
    timeout-minutes: 40
    env:
      COINPUP_DATABASE_URL: postgresql+psycopg://coinpup:test-only@localhost:5432/coinpup
      COINPUP_RUN_DB_TESTS: "1"
      # A slow test prints its threads without interrupting setup, calls or teardown.
      PYTEST_ADDOPTS: "-vv --durations=20 -p scripts.db_ci_pytest"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Run disposable database checks
        # The pre-checkout service hook cannot use the existing official-image fallback.
        # Each partition has its own database and exercises the complete migration round trip.
        env:
          COINPUP_DB_CI_PART: ${{ matrix.part }}
          COINPUP_DB_CI_REPORT: ${{ runner.temp }}/part-${{ matrix.part }}.json
        run: |
          python -m scripts.start_database_ci
          /usr/bin/time -v python scripts/check.py db 2> >(tee "$RUNNER_TEMP/db-stderr.log" >&2)
      - name: Capture failed partition diagnostics
        if: failure()
        run: |
          group=$(awk -F: '$1 == "0" {print $3}' /proc/self/cgroup)
          for metric in memory.events memory.max memory.peak; do
            file="/sys/fs/cgroup${group%/}/$metric"
            if test -r "$file"; then echo "$metric"; cat "$file"; fi
          done
          df -h "$RUNNER_TEMP"
          if docker container inspect coinpup-ci-postgres >/dev/null 2>&1; then
            docker inspect --format 'PostgreSQL status={{.State.Status}} OOMKilled={{.State.OOMKilled}} exit={{.State.ExitCode}}' coinpup-ci-postgres
            docker exec coinpup-ci-postgres pg_isready -U coinpup -d coinpup
            docker exec coinpup-ci-postgres psql -X -U coinpup -d coinpup -c \
              "SELECT deadlocks, temp_files, temp_bytes, sessions_fatal, sessions_killed FROM pg_stat_database WHERE datname = current_database()"
          fi
      - name: Save failed partition stderr
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: db-stderr-part-${{ matrix.part }}
          path: ${{ runner.temp }}/db-stderr.log
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore
      - name: Remove disposable database
        if: always()
        run: python -m scripts.start_database_ci --stop
      - name: Save partition test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-ci-part-${{ matrix.part }}
          path: ${{ runner.temp }}/part-${{ matrix.part }}.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  database:
    name: PostgreSQL migrations and integration tests
    needs: database-parts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both database partitions to succeed
        env:
          PARTS_RESULT: ${{ needs.database-parts.result }}
        run: test "$PARTS_RESULT" = success
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: db-ci-part-0
          path: ${{ runner.temp }}/db-ci-part-0
      - uses: actions/download-artifact@v4
        with:
          name: db-ci-part-1
          path: ${{ runner.temp }}/db-ci-part-1
      - name: Verify complete integration test execution
        run: >-
          python -m scripts.db_ci_manifest verify
          "$RUNNER_TEMP/db-ci-part-0/part-0.json"
          "$RUNNER_TEMP/db-ci-part-1/part-1.json"

  container:
    name: Container, real browser login and backup restoration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Fictional credentials for the disposable CI database, never deployment defaults.
      E2E_USERNAME: admin-e2e
      E2E_PASSWORD: Test-only-password-2026!
      BASE_URL: http://127.0.0.1:8000
      COMPOSE_FILE: ${{ github.workspace }}/compose.yaml:${{ github.workspace }}/ops/compose.browser.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install browser tests
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Create disposable development configuration
        run: python3 scripts/init_env.py
      - name: Start services
        run: |
          python3 scripts/prepare_browser_ci_image.py --pull
          export COMPOSE_FILE="${COMPOSE_FILE}:${GITHUB_WORKSPACE}/build/compose.browser-images.yaml"
          echo "COMPOSE_FILE=${COMPOSE_FILE}" >> "$GITHUB_ENV"
          docker compose up -d --build --wait
      - name: Apply migrations
        run: docker compose exec -T api python -m alembic upgrade head
      - name: Verify API connection
        run: curl --fail http://127.0.0.1:8000/api/v1/health/ready
      - name: Create disposable test administrator
        run: >-
          docker compose exec -T
          -e COINPUP_ENVIRONMENT=test -e COINPUP_CREATE_TEST_ADMIN=1
          -e E2E_USERNAME -e E2E_PASSWORD
          api python scripts/create_test_admin.py
      - name: Verify recurring maintenance CLI
        run: docker compose exec -T api python -m coinpup_api.jobs recurring-invoices --per-rule 1
      - name: Verify real browser authentication
        run: npm --prefix apps/web run test:e2e
      - name: Verify database and private-file bundles in isolated recovery targets
        run: >-
          docker compose exec -T
          -e COINPUP_ENVIRONMENT=test -e COINPUP_RUN_BACKUP_TESTS=1
          api python scripts/check_compose_backup.py
      - name: Save browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
      - name: Remove disposable services and database
        if: always()
        run: docker compose down --volumes
