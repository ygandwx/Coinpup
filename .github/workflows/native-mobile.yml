name: Native mobile acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/native-mobile.yml"
      - ".github/scripts/t12-android*"
      - "apps/mobile/**"
      - "services/api/**"
      - "contracts/openapi.json"
      - "Dockerfile"
      - "compose.yaml"
      - "ops/compose.browser.yaml"
      - "scripts/create_test_admin.py"
      - "scripts/init_env.py"
      - "scripts/init_private_key.py"
      - "scripts/prepare_browser_ci_image.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"
  FLUTTER_REVISION: ab2912035e160d9cad6306df307576da6128ebdb
  FLUTTER_SUPPRESS_ANALYTICS: "true"

jobs:
  android:
    name: Android release APK and device acceptance
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      E2E_USERNAME: admin-native-e2e
      COMPOSE_PROJECT_NAME: coinpup-native-ci
      COMPOSE_FILE: ${{ github.workspace }}/compose.yaml:${{ github.workspace }}/ops/compose.browser.yaml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up pinned Temurin JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          # Adoptium's SemVer encoding for Temurin 17.0.21.1+2.
          java-version: "17.0.21+100000002"
      - name: Set up pinned Flutter
        run: |
          sdk="$RUNNER_TEMP/coinpup-flutter"
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$sdk"
          test "$(git -C "$sdk" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          "$sdk/bin/flutter" --version
      - name: Set up Android SDK 36 and build dependencies
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' </dev/null
          grep -Ex 'Pkg.Revision *= *2' "$ANDROID_HOME/platforms/android-36/source.properties"
          flutter config --jdk-dir "$JAVA_HOME"
          java -version
      - name: Build Android release APK with the ephemeral debug key
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed integration_test
          flutter analyze --fatal-infos
          # Flutter regenerates the release plugin registrant only with pub enabled.
          flutter build apk --release
          git diff --exit-code -- pubspec.lock
          registrant=android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          test -s "$registrant"
          if grep -Fq 'dev.flutter.plugins.integration_test.' "$registrant"; then
            echo 'The release registrant includes the device test plugin.' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
      - name: Start and migrate the disposable API
        run: |
          umask 077
          python3 scripts/init_env.py
          python3 scripts/prepare_browser_ci_image.py --pull
          export COMPOSE_FILE="$COMPOSE_FILE:$GITHUB_WORKSPACE/build/compose.browser-images.yaml"
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"
          docker compose build api
          docker compose up -d --wait postgres
          docker compose run --rm --no-deps -T api python -m alembic upgrade head
          docker compose up -d --wait api
          docker compose exec -T api python -m alembic current
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health/ready
      - name: Create a fictional test administrator
        run: |
          E2E_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_hex(24))')
          echo "::add-mask::$E2E_PASSWORD"
          export E2E_PASSWORD
          docker compose exec -T \
            -e COINPUP_ENVIRONMENT=test -e COINPUP_CREATE_TEST_ADMIN=1 \
            -e E2E_USERNAME -e E2E_PASSWORD api python scripts/create_test_admin.py
          echo "E2E_PASSWORD=$E2E_PASSWORD" >> "$GITHUB_ENV"
      - name: Enable hardware acceleration on this ephemeral runner
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Install the APK and exercise login, offline sync and native camera
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-build: 16970787 # 37.3.10 stable
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: bash .github/scripts/t12-android-acceptance.sh
      - name: Upload the release Android APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coinpup-android-release-${{ github.run_attempt }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error
      - name: Diagnose acceptance failures
        if: failure()
        run: |
          df -h "$RUNNER_TEMP"
          if [[ -f .env ]]; then
            docker compose ps -a
            docker compose logs --no-color --tail=100
          fi
      - name: Remove disposable services and volumes
        if: always()
        run: |
          if [[ -f .env ]]; then
            docker compose down --volumes
          fi

  ios:
    name: iOS unsigned device build
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up pinned Flutter
        run: |
          sdk="$RUNNER_TEMP/coinpup-flutter"
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$sdk"
          test "$(git -C "$sdk" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          "$sdk/bin/flutter" --version
      - name: Build iOS without code signing
        working-directory: apps/mobile
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = "Xcode 26.3"
          flutter pub get --enforce-lockfile
          flutter build ios --no-codesign --no-pub
          test -s build/ios/iphoneos/Runner.app/Runner
