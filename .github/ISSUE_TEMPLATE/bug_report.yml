name: 缺陷报告
description: 报告可复现的问题，并提供不含敏感信息的证据。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请使用虚构数据复现。不要提交密码、令牌、真实账单、银行账号或个人／公司财务记录。
  - type: input
    id: task
    attributes:
      label: 关联任务
      description: 如 T02 账务核心；不确定可写“待归类”。
      placeholder: T02
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: 提供提交或版本、操作系统、浏览器／App 版本及相关服务版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 使用虚构数据创建……
        2. 执行……
        3. 观察……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与影响
      description: 说明是否影响金额、数据保存或已有记录；附脱敏错误和截图（如有）。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交检查
      options:
        - label: 我已检查报告和附件，不包含凭据或真实财务数据。
          required: true
