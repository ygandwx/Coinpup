# Local development; production requires explicit HTTPS and deployment configuration.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: coinpup
      POSTGRES_USER: coinpup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinpup -d coinpup"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      COINPUP_ENVIRONMENT: development
      COINPUP_ALLOWED_ORIGINS: '["http://127.0.0.1:8000", "http://localhost:8000", "http://127.0.0.1:5173", "http://localhost:5173"]'
      COINPUP_DATABASE_URL: postgresql+psycopg://coinpup:${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}@postgres:5432/coinpup
      COINPUP_FILES_DIRECTORY: /app/data/files
    volumes:
      - files_data:/app/data/files
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
volumes:
  postgres_data:
  files_data:
