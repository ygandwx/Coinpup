[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coinpup-api"
version = "0.1.0"
description = "Coinpup self-hosted bookkeeping API foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "pip-tools>=7,<8"]
ocr = ["pypdf==6.19.0", "pdfplumber==0.11.10", "pypdfium2==5.13.0"]

[tool.setuptools.packages.find]
where = ["services/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api/src"]
addopts = "-ra --import-mode=importlib"
markers = [
  "integration: requires an explicitly configured disposable PostgreSQL database",
  "ocr: requires the separately locked optional OCR dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
